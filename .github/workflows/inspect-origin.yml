name: inspect-origin
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: [self-hosted]
    steps:
      - name: Point api.xn--rh3b.net at host :14741
        run: |
          set -euo pipefail
          YML="http:
  routers:
    api-14741-web:
      rule: Host(\`api.xn--rh3b.net\`)
      service: api-14741
      middlewares:
        - redirect-to-https
      entryPoints:
        - web
      priority: 1000
    api-14741-websecure:
      rule: Host(\`api.xn--rh3b.net\`)
      service: api-14741
      entryPoints:
        - websecure
      priority: 1000
      tls:
        certResolver: letsencrypt
  services:
    api-14741:
      loadBalancer:
        servers:
          - url: http://172.17.0.1:14741
        passHostHeader: true
"
          if [ -d /etc/dokploy/traefik/dynamic ]; then
            printf "%s\n" "$YML" | sudo tee /etc/dokploy/traefik/dynamic/api-14741.yml >/dev/null
            sudo chmod 644 /etc/dokploy/traefik/dynamic/api-14741.yml
            echo "wrote host /etc/dokploy/traefik/dynamic/api-14741.yml"
          else
            printf "%s\n" "$YML" | docker exec -i dokploy-traefik sh -c "cat > /etc/dokploy/traefik/dynamic/api-14741.yml"
            echo "wrote via docker exec"
          fi
          docker exec dokploy-traefik cat /etc/dokploy/traefik/dynamic/api-14741.yml
          echo "===== wait reload ====="
          sleep 3
          echo "===== via docker0 ====="
          curl -sS -m 5 http://172.17.0.1:14741/ | head -c 220; echo
          echo "===== via traefik localhost 443 ====="
          curl -skS -m 8 --resolve api.xn--rh3b.net:443:127.0.0.1 https://api.xn--rh3b.net/ | head -c 280; echo
          echo
          curl -skS -m 8 -o /tmp/k -w "local_kdmhs=%{http_code}\n" --resolve api.xn--rh3b.net:443:127.0.0.1 https://api.xn--rh3b.net/kdmhs/2026-08-19
          head -c 120 /tmp/k; echo
