name: inspect-origin
on:
  workflow_dispatch:
jobs:
  one:
    runs-on: [self-hosted]
    steps:
      - name: List bap apps and ports
        run: |
          set -euo pipefail
          echo '===== docker ps bap ====='
          docker ps -a --format 'name={{.Names}} image={{.Image}} ports={{.Ports}} status={{.Status}}' | grep -i bap || echo 'NO_BAP_CONTAINER'
          echo '===== swarm services bap ====='
          docker service ls --format '{{.Name}} {{.Image}} {{.Replicas}} {{.Ports}}' | grep -i bap || echo 'NO_BAP_SERVICE'
          echo '===== 14741 listeners ====='
          ss -lntup 2>/dev/null | grep 14741 || netstat -lntup 2>/dev/null | grep 14741 || echo 'no ss/netstat 14741'
          echo '===== traefik bap yml ====='
          ls -la /etc/dokploy/traefik/dynamic/*bap* 2>/dev/null || echo 'no bap yml files'
          echo '----- file -----'
          for f in /etc/dokploy/traefik/dynamic/*bap*; do
            [ -f "$f" ] && echo "FILE $f" && cat "$f"
          done
          echo '===== curl local ====='
          curl -sS -o /tmp/r.json -w 'loopback14741=%{http_code} ' --max-time 5 http://127.0.0.1:14741/ || true
          echo
          head -c 220 /tmp/r.json 2>/dev/null; echo
