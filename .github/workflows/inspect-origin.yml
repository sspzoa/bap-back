name: inspect-origin
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: [self-hosted]
    steps:
      - name: Recreate 443 service and traefik route
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          REFRESH_API_KEY: ${{ secrets.REFRESH_API_KEY }}
        run: |
          set -euo pipefail
          echo  | base64 -d | sudo tee /etc/dokploy/traefik/dynamic/bapnet-bapback-smqpi6.yml >/dev/null
          sudo chmod 644 /etc/dokploy/traefik/dynamic/bapnet-bapback-smqpi6.yml
          echo wrote traefik yml
          if docker service inspect bapnet-bapback-smqpi6 >/dev/null 2>&1; then
            echo service already exists
          else
            docker service create \
              --name bapnet-bapback-smqpi6 \
              --network dokploy-network \
              --env "MONGODB_URI=${MONGODB_URI}" \
              --env "REFRESH_API_KEY=${REFRESH_API_KEY}" \
              --env "TZ=Asia/Seoul" \
              --restart-condition any \
              bapnet-bapback-smqpi6:latest
          fi
          sleep 5
          docker service ps bapnet-bapback-smqpi6
          echo "===== 443 ====="
          curl -skS -m 8 -o /tmp/r -w '443=%{http_code}\n' --resolve api.xn--rh3b.net:443:127.0.0.1 https://api.xn--rh3b.net/
          head -c 200 /tmp/r; echo
          echo "===== 14741 ====="
          curl -sS -m 5 -o /tmp/c -w '14741=%{http_code}\n' http://127.0.0.1:14741/
          head -c 180 /tmp/c; echo
