name: inspect-origin
on:
  workflow_dispatch:
jobs:
  rm:
    runs-on: [self-hosted]
    steps:
      - name: Remove 443 dokploy bap service
        run: |
          set -euo pipefail
          echo "===== before ====="
          docker service ls | sed -n '1,40p'
          docker service rm bapnet-bapback-smqpi6
          if [ -f /etc/dokploy/traefik/dynamic/bapnet-bapback-smqpi6.yml ]; then
            sudo rm -f /etc/dokploy/traefik/dynamic/bapnet-bapback-smqpi6.yml
            echo removed traefik yml
          fi
          echo "===== after services ====="
          docker service ls | sed -n '1,40p'
          echo "===== 14741 still up ====="
          curl -sS -m 5 -o /tmp/c -w '14741=%{http_code}\n' http://127.0.0.1:14741/
          head -c 180 /tmp/c; echo
          echo "===== 443 host ====="
          curl -skS -m 5 -o /tmp/r -w '443=%{http_code}\n' -H 'Host: api.xn--rh3b.net' https://127.0.0.1/ || true
          head -c 160 /tmp/r; echo
