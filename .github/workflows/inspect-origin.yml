name: inspect-origin
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: [self-hosted]
    steps:
      - name: Point api host at 14741
        run: |
          set -euo pipefail
          echo  | base64 -d | sudo tee /etc/dokploy/traefik/dynamic/api-14741.yml >/dev/null
          sudo chmod 644 /etc/dokploy/traefik/dynamic/api-14741.yml
          echo wrote host file
          cat /etc/dokploy/traefik/dynamic/api-14741.yml
          docker exec dokploy-traefik cat /etc/dokploy/traefik/dynamic/api-14741.yml
          sleep 3
          echo "===== docker0 ====="
          curl -sS -m 5 http://172.17.0.1:14741/ | head -c 220; echo
          echo "===== local 443 ====="
          curl -skS -m 8 --resolve api.xn--rh3b.net:443:127.0.0.1 https://api.xn--rh3b.net/ | head -c 280; echo
          curl -skS -m 8 -o /tmp/k -w "local_kdmhs=%{http_code}\n" --resolve api.xn--rh3b.net:443:127.0.0.1 https://api.xn--rh3b.net/kdmhs/2026-08-19
          head -c 140 /tmp/k; echo
