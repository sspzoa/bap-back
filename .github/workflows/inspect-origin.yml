name: inspect-origin
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: [self-hosted]
    steps:
      - name: Fix traefik no https redirect loop
        run: |
          set -euo pipefail
          echo  | base64 -d | sudo tee /etc/dokploy/traefik/dynamic/api-14741.yml >/dev/null
          sudo chmod 644 /etc/dokploy/traefik/dynamic/api-14741.yml
          echo '--- file ---'
          cat /etc/dokploy/traefik/dynamic/api-14741.yml
          sleep 3
          echo '--- origin 80 ---'
          curl -sS -m 5 -o /tmp/a -w '80=%{http_code}\n' -H 'Host: api.xn--rh3b.net' http://127.0.0.1/
          head -c 200 /tmp/a; echo
          echo '--- origin 443 ---'
          curl -skS -m 5 -o /tmp/b -w '443=%{http_code}\n' --resolve api.xn--rh3b.net:443:127.0.0.1 https://api.xn--rh3b.net/kdmhs/2026-08-19
          head -c 160 /tmp/b; echo
