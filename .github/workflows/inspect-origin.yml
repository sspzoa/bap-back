name: inspect-origin
on:
  workflow_dispatch:
jobs:
  revert:
    runs-on: [self-hosted]
    steps:
      - name: Remove api-14741 traefik overlay
        run: |
          set -euo pipefail
          echo "===== before ====="
          ls -la /etc/dokploy/traefik/dynamic | sed -n '1,30p'
          if [ -f /etc/dokploy/traefik/dynamic/api-14741.yml ]; then
            sudo rm -f /etc/dokploy/traefik/dynamic/api-14741.yml
            echo removed api-14741.yml
          else
            echo api-14741.yml already gone
          fi
          echo "===== after ====="
          ls /etc/dokploy/traefik/dynamic
          echo "===== dokploy bap yml still there ====="
          sudo sed -n '1,40p' /etc/dokploy/traefik/dynamic/bapnet-bapback-smqpi6.yml
          sleep 3
          echo "===== origin 443 ====="
          curl -skS -m 8 -o /tmp/r -w '443=%{http_code}\n' -H 'Host: api.xn--rh3b.net' https://127.0.0.1/
          head -c 220 /tmp/r; echo
          echo "===== 14741 still CI ====="
          curl -sS -m 5 -o /tmp/c -w '14741=%{http_code}\n' http://127.0.0.1:14741/
          head -c 220 /tmp/c; echo
