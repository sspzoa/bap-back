name: inspect-origin
on:
  workflow_dispatch:
    inputs:
      mode:
        description: dump or fix
        default: dump
jobs:
  run:
    runs-on: [self-hosted]
    steps:
      - name: dump or fix traefik
        run: |
          set -e
          echo "===== current dynamic yml ====="
          docker exec dokploy-traefik cat /etc/dokploy/traefik/dynamic/bapnet-bapback-smqpi6.yml || true
          echo
          echo "===== dynamic dir ====="
          docker exec dokploy-traefik ls -la /etc/dokploy/traefik/dynamic
          echo
          echo "===== host gateway from traefik ====="
          docker exec dokploy-traefik sh -c "getent hosts host.docker.internal; ip route | head -5"
          if [ "${{ github.event.inputs.mode }}" = "fix" ]; then
            echo "===== applying 14741 router ====="
            # write via a temp on the runner host, then docker cp if the path is bind-mounted
            if [ -f /etc/dokploy/traefik/dynamic/bapnet-bapback-smqpi6.yml ]; then
              TARGET=/etc/dokploy/traefik/dynamic
            else
              TARGET=""
              docker exec dokploy-traefik sh -c "ls /etc/dokploy/traefik/dynamic/bapnet-bapback-smqpi6.yml"
            fi
            echo "host target=$TARGET"
            ls -la /etc/dokploy/traefik/dynamic 2>/dev/null || true
          fi
