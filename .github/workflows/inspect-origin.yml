name: inspect-origin
on:
  workflow_dispatch:
jobs:
  one:
    runs-on: [self-hosted]
    steps:
      - name: Point 443 at CI 14741 and remove dokploy app
        run: |
          set -euo pipefail
          echo  | base64 -d | sudo tee /etc/dokploy/traefik/dynamic/bapnet-bapback-smqpi6.yml >/dev/null
          sudo chmod 644 /etc/dokploy/traefik/dynamic/bapnet-bapback-smqpi6.yml
          docker service rm bapnet-bapback-smqpi6 || true
          echo "===== 14741 ====="
          curl -sS -m 5 -o /tmp/c -w '14741=%{http_code}\n' http://127.0.0.1:14741/
          head -c 200 /tmp/c; echo
          sleep 3
          echo "===== 443 ====="
          curl -skS -m 8 -o /tmp/r -w '443=%{http_code}\n' --resolve api.xn--rh3b.net:443:127.0.0.1 https://api.xn--rh3b.net/
          head -c 220 /tmp/r; echo
          echo "===== services bap ====="
          docker service ls --format '{{.Name}}' | grep -i bap || echo none
          docker ps --format '{{.Names}} {{.Ports}}' | grep -i bap || true
