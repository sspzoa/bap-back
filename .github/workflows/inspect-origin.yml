name: inspect-origin
on:
  workflow_dispatch:
jobs:
  one:
    runs-on: [self-hosted]
    steps:
      - name: Kill leftover dokploy bap container
        run: |
          set -euo pipefail
          docker ps -a --format '{{.Names}}' | grep bapnet-bapback || echo none
          docker ps -aq --filter name=bapnet-bapback | xargs -r docker rm -f
          echo "===== left ====="
          docker ps --format '{{.Names}} {{.Ports}}' | grep -i bap || echo 'only what is below'
          docker ps --format '{{.Names}} {{.Ports}}'
