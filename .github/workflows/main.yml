name: CI/CD Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}
  VERSION: ${{ github.sha }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ env.VERSION }}
          restore-keys: ${{ runner.os }}-buildx-
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    name: Deploy to Colossus
    runs-on: [self-hosted, colossus]
    steps:
      - name: Write env and start blue
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          REFRESH_API_KEY: ${{ secrets.REFRESH_API_KEY }}
          MINDLOGIC_KEY: ${{ secrets.MINDLOGIC_KEY }}
        run: |
          set -euo pipefail
          umask 077
          {
            echo "MONGODB_URI=${MONGODB_URI}"
            echo "REFRESH_API_KEY=${REFRESH_API_KEY}"
            echo "MINDLOGIC_KEY=${MINDLOGIC_KEY}"
            echo "NODE_ENV=production"
            echo "IMAGE_TAG=latest"
          } > /opt/bap-back/.env
          chmod 600 /opt/bap-back/.env
          cd /opt/bap-back
          sudo docker compose pull app-blue
          sudo docker compose up -d --force-recreate app-blue
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/health >/dev/null; then
              echo "blue healthy"
              exit 0
            fi
            sleep 2
          done
          echo "blue failed health"
          sudo docker compose logs --tail=80 app-blue
          exit 1
