 Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}
  VERSION: ${{ github.sha }}
  NAME: ${{ github.repository_id }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ env.VERSION }}
          restore-keys: ${{ runner.os }}-buildx-
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and Push Docker Image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:latest

  deploy:
    needs: build
    name: Deploy
    runs-on: [ self-hosted ]
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Deploy to 443
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          REFRESH_API_KEY: ${{ secrets.REFRESH_API_KEY }}
          MINDLOGIC_KEY: ${{ secrets.MINDLOGIC_KEY }}
        run: |
          set -euo pipefail
          docker pull "${{ env.DOCKER_IMAGE }}:latest"
          docker service update --detach=false --with-registry-auth \
            --image "${{ env.DOCKER_IMAGE }}:latest" \
            --env-add "MONGODB_URI=${MONGODB_URI}" \
            --env-add "REFRESH_API_KEY=${REFRESH_API_KEY}" \
            --env-add "MINDLOGIC_KEY=${MINDLOGIC_KEY}" \
            --env-add "NODE_ENV=production" \
            bapnet-bapback-smqpi6
          docker stop bap-back || true
          docker rm bap-back || true
          ok=0
          for i in $(seq 1 30); do
            if curl -skfsS --max-time 3 --resolve api.xn--rh3b.net:443:127.0.0.1 https://api.xn--rh3b.net/health >/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "443 health failed"
            docker service ps bapnet-bapback-smqpi6
            exit 1
          fi
          echo "live on 443"
